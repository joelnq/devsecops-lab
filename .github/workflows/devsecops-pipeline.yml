name: Pipeline DevSecOps End-to-End

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  secret-scanning:
    name: 1. Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: 2. SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar Semgrep
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan --config auto --exclude='.github' --error

  sca:
    name: 3. SCA (Trivy Filesystem)
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - uses: actions/checkout@v4
      - name: Escanear dependencias con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  iac-security:
    name: 4. IaC Security (Checkov)
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - uses: actions/checkout@v4
      - name: Escanear IaC con Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: '.'
          framework: 'terraform,dockerfile'
          soft_fail: true

  build-scan-sbom:
    name: 5. Build, Container Scan & SBOM
    runs-on: ubuntu-latest
    needs: [sast, sca, iac-security]
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos de Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=short

      - name: Construir imagen local para escaneo
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Generar SBOM con Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Subir SBOM como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Escanear imagen del contenedor con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Construir y publicar imagen final en GHCR
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  sign-image:
    name: 6. Firma de Artefacto (Cosign Keyless)
    runs-on: ubuntu-latest
    needs: build-scan-sbom
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Iniciar sesión en GHCR para Cosign
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Firmar imagen con Cosign (Keyless / OIDC)
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}@${{ needs.build-scan-sbom.outputs.image_digest }}
